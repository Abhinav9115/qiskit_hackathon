[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsc"
version = "1.0.0"
description = "Production-Grade Post-Quantum Secure Channel (QFF 2026 — Track 5, P1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "liboqs-python>=0.16.0",
    "cryptography>=46.0.0",
    "psutil>=7.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]

[project.scripts]
qsc = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
